# Physical UART0: shared interactive shell, application logs and MCUmgr SMP.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_PROMPT_UART="nano33> "
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_TRANSPORT_SHELL_INPUT_TIMEOUT=y

# Emit a visible startup banner before the interactive shell.
CONFIG_BOOT_BANNER=y
CONFIG_PRINTK=y
