# Keep the application linker region outside NVS and the CCFG sector.
CONFIG_USE_DT_CODE_PARTITION=y

# Store Zephyr settings in the dedicated NVS partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_SIZE_MULT=1
CONFIG_SETTINGS_NVS_SECTOR_COUNT=2

# For a dedicated RCP, commissioning belongs on the host
# CONFIG_OPENTHREAD_COMMISSIONER=n
# CONFIG_OPENTHREAD_BORDER_AGENT=n
