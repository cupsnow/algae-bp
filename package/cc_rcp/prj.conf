CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y

# Disable certain parts of Zephyr IPv6 stack
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n

# Use NVS as settings backend
CONFIG_NVS=y

# Disable boot banner
CONFIG_BOOT_BANNER=n

# Kernel options
CONFIG_MAIN_STACK_SIZE=2560

# Set OpenThread NCP architecture
CONFIG_OPENTHREAD_COPROCESSOR=y
# CONFIG_OPENTHREAD_COPROCESSOR_NCP=y

# Add features required for NCP
# CONFIG_OPENTHREAD_DIAG=y
# CONFIG_OPENTHREAD_DHCP6_SERVER=y
# CONFIG_OPENTHREAD_COMMISSIONER=y
# CONFIG_OPENTHREAD_BORDER_AGENT=y
# CONFIG_OPENTHREAD_BORDER_ROUTER=y
# CONFIG_OPENTHREAD_UDP_FORWARD=y
# CONFIG_OPENTHREAD_ENABLE_SERVICE=y

# This overlay switches from NCP to RCP, use in combination with prj.conf

CONFIG_OPENTHREAD_COPROCESSOR_NCP=n
CONFIG_OPENTHREAD_COPROCESSOR_RCP=y

CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8


# This overlay apply for beagleplay bundled cc1352p7

# Keep the application linker region outside NVS and the CCFG sector.
CONFIG_USE_DT_CODE_PARTITION=y

# Store Zephyr settings in the dedicated NVS partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
# CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_SIZE_MULT=1
CONFIG_SETTINGS_NVS_SECTOR_COUNT=2

# For a dedicated RCP, commissioning belongs on the host
CONFIG_OPENTHREAD_COMMISSIONER=n
CONFIG_OPENTHREAD_BORDER_AGENT=n
