image sdcard.img {
  hdimage {
    partition-table-type = "hybrid"
  }

  partition boot {
    partition-type = 0x0C
    bootable = "true"
    image = "boot.vfat"
    offset = 1M
    size = 128M
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext4"
  }
}

image boot.vfat {
  vfat {
    files = {
      "tiboot3.bin",
      "tispl.bin",
      "u-boot.img",
      "uboot.env",
      "uboot-redund.env",
      "linux.itb"
    }
  }
  size = 128M
}
